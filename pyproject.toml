[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-ml-price"
version = "0.1.0"
description = "Multimodal price-prediction pipeline for Amazon ML Challenge 2025"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
models = ["catboost>=1.2", "lightgbm>=4.0", "torch>=2.1", "xgboost>=2.0"]
embeddings = [
  "Pillow>=10",
  "requests>=2.31",
  "sentence-transformers>=3.0",
  "torch>=2.1",
  "transformers>=4.49",
]
kaggle = ["kaggle>=1.7"]
dev = ["pytest>=8", "ruff>=0.5"]
all = [
  "catboost>=1.2",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "Pillow>=10",
  "requests>=2.31",
  "sentence-transformers>=3.0",
  "torch>=2.1",
  "transformers>=4.49",
  "kaggle>=1.7",
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
amazon-ml-price = "amazon_ml_price.cli:main"
amazon-ml-run = "amazon_ml_price.cli:workflow_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
